<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title data-keep="">FIZTEX Expert Hub</title>
<link rel="icon" href="images/logo.png">
<meta data-keep="" name="claude:viewport-fit-sides" content="cover">
<link data-keep="" rel="preconnect" href="https://fonts.googleapis.com">
<link data-keep="" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style data-keep="">
:root{
  --bg:#F4F6FB; --surface:#FFFFFF; --ink:#1A2240; --muted:#586078; --line:#DCE0EA;
  --primary:#3A4CDF; --primary-hover:#2C3CC0; --primary-ink:#FFFFFF; --soft:#E6EAFD;
  --accent:#2F6BFF; --accent-ink:#FFFFFF; --sky:#0096B4; --navy:#1A2240;
  --ok:#1E7F4E; --ok-soft:#E2F3EA; --danger:#B42318; --danger-soft:#FBE7E5;
  --c-bio:#1E8A5A; --c-eco:#0F7C86; --c-ai:#6A43D6; --c-robo:#D0631B;--c-chem:#B4236E; --c-edu:#A35C00;
  --display:"Onest", "Segoe UI", system-ui, sans-serif;
  --body:"Onest", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:8px;
  --veil-strong:rgb(244 246 251 / .94); --veil-soft:rgb(244 246 251 / .80);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C111E; --surface:#141B2C; --ink:#E7EBF5; --muted:#9AA3B9; --line:#263049;
  --primary:#8391FF; --primary-hover:#A0ABFF; --primary-ink:#0C111E; --soft:#1C2448;
  --accent:#4D8BFF; --accent-ink:#FFFFFF; --sky:#3CC9E0; --navy:#E7EBF5;
  --ok:#5FD39A; --ok-soft:#14301F; --danger:#FF8A80; --danger-soft:#3A1715;
  --c-bio:#5ACB92; --c-eco:#4CC3CD; --c-ai:#A88BFF; --c-robo:#FF9F5C;--c-chem:#F27BB8; --c-edu:#F2B84B; --veil-strong:rgb(12 17 30 / .94); --veil-soft:rgb(12 17 30 / .80); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C111E; --surface:#141B2C; --ink:#E7EBF5; --muted:#9AA3B9; --line:#263049;
  --primary:#8391FF; --primary-hover:#A0ABFF; --primary-ink:#0C111E; --soft:#1C2448;
  --accent:#4D8BFF; --accent-ink:#FFFFFF; --sky:#3CC9E0; --navy:#E7EBF5;
  --ok:#5FD39A; --ok-soft:#14301F; --danger:#FF8A80; --danger-soft:#3A1715;
  --c-bio:#5ACB92; --c-eco:#4CC3CD; --c-ai:#A88BFF; --c-robo:#FF9F5C;--c-chem:#F27BB8; --c-edu:#F2B84B; --veil-strong:rgb(12 17 30 / .94); --veil-soft:rgb(12 17 30 / .80); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
a{color:var(--primary)}
h1,h2,h3{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--primary)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 15px/1 var(--body);padding:12px 18px;border-radius:10px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{background:var(--primary-hover)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--sky);color:var(--sky)}
.btn-accent{background:var(--accent);color:var(--accent-ink)}
.btn-accent:hover{filter:brightness(1.06)}
.btn-sm{padding:9px 13px;font-size:14px}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--line)}
.btn-danger:hover{background:var(--danger-soft);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:not-allowed}

/* admin bar */
.adminbar{background:#1A2240;color:#FFFFFF}
.adminbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;flex-wrap:wrap;font-size:14px}
.adminbar .btn{background:var(--accent);color:var(--accent-ink);padding:8px 14px;font-size:14px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:20px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo-mark{flex:none;width:40px;height:40px;display:block;border-radius:11px;background:#1B2A63;object-fit:cover;box-shadow:0 4px 12px rgb(47 107 255 / .28)}
.logo-text{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo b{font:800 21px/1 var(--display);letter-spacing:.03em}
.logo i{width:1px;height:20px;background:var(--line);flex:none}
.logo small{font:500 15px/1 var(--body);color:var(--muted)}
@media (max-width:560px){.logo i,.logo small{display:none}}
.contacts{display:flex;gap:8px;flex-wrap:wrap}
.contacts a{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px;background:var(--surface)}
.contacts a:hover{border-color:var(--primary);color:var(--primary)}
.contacts svg{width:16px;height:16px;flex:none;fill:currentColor}
.contacts span{color:var(--muted);font-weight:500}
.contacts .mailpill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);font:600 14px var(--body);cursor:pointer}
.contacts .mailpill:hover{border-color:var(--primary);color:var(--primary)}
.contacts .mailpill .addr{color:var(--ink);font-weight:600;user-select:all}
.contacts .mailpill .tip{font-size:12px;color:var(--muted);border-left:1px solid var(--line);padding-left:8px}
nav.links{display:flex;gap:18px;margin-left:auto}
nav.links a{color:var(--muted);text-decoration:none;font-weight:500;font-size:15px}
nav.links a:hover{color:var(--ink)}
@media (max-width:900px){nav.links{display:none} header.top .btn-accent{margin-left:auto}}

/* hero */
.hero{position:relative;isolation:isolate;color:#FFFFFF;background:#0B1430 var(--hero-img,none) center 38%/cover no-repeat;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgb(9 16 40 / .92) 0%,rgb(9 16 40 / .78) 38%,rgb(9 16 40 / .25) 72%,rgb(9 16 40 / .1) 100%),linear-gradient(0deg,rgb(9 16 40 / .85) 0%,rgb(9 16 40 / 0) 40%)}
.hero .wrap{padding-block:88px 120px;min-height:min(640px,82vh);display:flex;flex-direction:column;justify-content:center}
.hero .eyebrow{color:#7DB2FF}
.hero h1{font-size:clamp(34px,5.2vw,62px);font-weight:800;letter-spacing:-.02em;max-width:16ch;margin-top:14px;color:#FFFFFF}
.hero h1 em{font-style:normal;color:#7DB2FF}
.hero .lead{font-size:18px;color:rgb(255 255 255 / .84);max-width:52ch;margin-top:18px}
.hero .cta{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
.hero .btn-primary{background:#2F6BFF;color:#FFFFFF}
.hero .btn-primary:hover{background:#4D84FF}
.hero .btn-ghost{color:#FFFFFF;border-color:rgb(255 255 255 / .55);background:rgb(255 255 255 / .06)}
.hero .btn-ghost:hover{border-color:#5FD6EA;background:rgb(0 175 202 / .22);color:#FFFFFF}
.hero .credit{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:56px;font-size:12px;color:rgb(255 255 255 / .7);text-align:right;max-width:40ch}
@media (max-width:700px){.hero::before{background:linear-gradient(0deg,rgb(9 16 40 / .95) 0%,rgb(9 16 40 / .75) 55%,rgb(9 16 40 / .45) 100%)} .hero .wrap{padding-block:56px 96px;min-height:0} .hero .credit{display:none}}
.stats-band{margin-top:-48px;position:relative;z-index:2}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 12px 30px rgb(9 16 40 / .14)}
.stat{background:var(--surface);padding:18px 20px}
.stat b{display:block;font:800 28px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted);font-weight:500}
@media (max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

section.band{padding-block:64px;border-top:1px solid var(--line);position:relative;isolation:isolate;overflow:hidden}
section.band.has-photo{background:var(--band-img) var(--band-pos,center)/cover no-repeat}
section.band.has-photo::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(var(--veil-dir,180deg),var(--veil-strong),var(--veil-soft))}
section.band:nth-of-type(even){--veil-dir:0deg}
.why article{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.steps li{background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:14px 18px 18px}
.sec-head{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.sec-head h2{font-size:clamp(26px,3.2vw,34px);font-weight:700;letter-spacing:-.015em}

.why{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.why article{padding:24px 26px}
.why h3{font-size:18px;margin:0 0 6px}
.why p{color:var(--muted)}
@media (max-width:860px){.why{grid-template-columns:1fr}}

.team{display:grid;grid-template-columns:1fr 2fr;gap:28px;align-items:center;background:var(--soft);border-radius:var(--r);padding:28px;margin-top:28px}
.team h3{font-size:24px}
.team ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.team li{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.team li::before{content:"";flex:none;width:10px;height:10px;margin-top:8px;border-radius:2px;background:var(--accent)}
@media (max-width:760px){.team{grid-template-columns:1fr}}
.team-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:end;margin-bottom:28px}
.team-head ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.team-head li{display:flex;gap:12px;align-items:flex-start;font-weight:500}
.team-head li::before{content:"";flex:none;width:10px;height:10px;margin-top:8px;border-radius:2px;background:var(--accent)}
@media (max-width:760px){.team-head{grid-template-columns:1fr}}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gallery figure{margin:0;position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:3/2;max-width:100%;background:var(--line);cursor:zoom-in}
.gallery img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
.gallery figure:hover img{transform:scale(1.03)}
.gallery figcaption{position:absolute;inset:auto 0 0 0;padding:28px 16px 14px;color:#FFFFFF;font-weight:600;font-size:15px;background:linear-gradient(0deg,rgb(9 16 40 / .82),rgb(9 16 40 / 0))}
.gallery figure:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (max-width:640px){.gallery{grid-template-columns:1fr}}
.lightbox{position:fixed;inset:0;z-index:95;background:rgb(5 8 18 / .92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:82vh;border-radius:10px}
.lightbox p{color:#FFFFFF;font-weight:600;text-align:center}
.thumb{width:96px;aspect-ratio:3/2;object-fit:cover;border-radius:8px;flex:none;background:var(--line)}
.prow{display:flex;gap:12px;align-items:flex-start}
.prow > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* mentors */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:999px;font:500 14px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.chip:hover{border-color:var(--sky)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cat{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cat i{width:8px;height:8px;border-radius:50%;background:var(--cc,var(--primary))}
.card h3{font-size:21px}
.card .role{font-weight:600;color:var(--muted);font-size:15px;margin-top:-6px}
.card .bio{color:var(--muted);font-size:15px}
.slots{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:6px}
.slots .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.slot{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:9px;padding:6px 6px 6px 12px;font:500 14px var(--mono)}
.slot .btn{padding:7px 12px;font-size:13px}
.tag-booked{font:600 12px var(--body);color:var(--muted);background:var(--bg);border-radius:6px;padding:6px 10px}
.empty{color:var(--muted);font-size:14px}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:620px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--line);font-size:15px}
th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--bg)}
tr:last-child td{border-bottom:0}
td .btn{padding:7px 12px;font-size:13px}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:s}
.steps li{list-style:none;border-top:3px solid var(--primary);padding-top:14px}
.steps li:nth-child(even){border-top-color:var(--sky)}
.steps .n{font:700 22px var(--body);color:var(--primary)}
.steps li:nth-child(even) .n{color:var(--sky)}
.steps h3{font-size:19px;margin:6px 0}
.steps p{color:var(--muted);font-size:15px}
.steps ol{margin:0;padding:0;display:contents}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* reviews */
.rev{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:28px;align-items:start}
@media (max-width:860px){.rev{grid-template-columns:1fr}}
form.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
input,select,textarea{font:400 15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--line);padding:2px}
.stars button.on{color:var(--accent)}
.rlist{display:flex;flex-direction:column;gap:14px}
.rcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.rcard .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.rcard b{color:var(--ink)}
.rcard .st{color:var(--accent);letter-spacing:2px}
.rcard p{margin-top:8px}
.note{font-size:14px;color:var(--muted);background:var(--bg);border-radius:9px;padding:10px 12px}

footer{border-top:1px solid var(--line);padding-block:32px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer b{color:var(--ink);font-family:var(--display)}

/* modal */
.overlay{position:fixed;inset:0;background:rgb(8 12 24 / .55);z-index:80;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--ink);border-radius:14px;max-width:480px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}
.modal h3{font-size:22px}
.modal-book{max-width:720px;padding:28px;position:relative;gap:20px}
.zbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;display:flex;flex-direction:column;gap:20px;align-items:flex-start}
.zsteps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:100%}
.zsteps div{display:flex;gap:10px;align-items:center;font-weight:600}
.zsteps b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--primary);display:grid;place-items:center;font-size:14px}
@media (max-width:760px){.zsteps{grid-template-columns:1fr 1fr}}
@media (max-width:440px){.zsteps{grid-template-columns:1fr}}
.mycall{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.join-btn{text-decoration:none}
/* scroll-driven elements */
:root{--sy:0;--sp:0;--logo-glow:drop-shadow(0 0 0 transparent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--logo-glow:drop-shadow(0 0 22px rgb(125 178 255 / .45))}}
:root[data-theme="dark"]{--logo-glow:drop-shadow(0 0 22px rgb(125 178 255 / .45))}
.ridge{position:absolute;left:0;right:0;bottom:-1px;height:clamp(70px,10vw,140px);z-index:0;pointer-events:none}
.ridge svg{position:absolute;inset:auto 0 0 0;width:100%;height:100%}
.ridge .far{fill:var(--bg);opacity:.35}
.ridge .near{fill:var(--bg)}
.birds{position:absolute;left:0;right:0;bottom:clamp(60px,9vw,130px);height:80px;z-index:0;pointer-events:none;transform:translateX(calc(var(--sy) * -0.35px))}
.bird{position:absolute;width:22px;height:10px;stroke:#FFFFFF;stroke-width:2.2;fill:none;stroke-linecap:round;opacity:.85;animation:flap 1.1s ease-in-out infinite}
@keyframes flap{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.45)}}
.floatlogo{position:absolute;z-index:0;width:clamp(140px,17vw,230px);pointer-events:none;filter:drop-shadow(0 18px 30px rgb(9 16 40 / .28)) var(--logo-glow);will-change:transform}
.floatlogo.fl1{left:-90px;top:46%;transform:rotate(calc(var(--sy) * .12deg))}
.floatlogo.fl2{right:-90px;top:40%;transform:rotate(calc(var(--sy) * -.1deg))}
section.band > .wrap{position:relative;z-index:1}
@media (max-width:700px){.floatlogo{width:110px;opacity:.5}.floatlogo.fl1{left:-55px}.floatlogo.fl2{right:-55px}.birds{display:none}}
.robotrack{position:fixed;left:0;right:0;bottom:0;height:46px;z-index:65;pointer-events:none;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);margin-bottom:env(safe-area-inset-bottom,0px)}
.pickbar + .robotrack{bottom:62px}
.robotrack .line{position:absolute;left:12px;right:12px;bottom:6px;height:4px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 22px);opacity:.25}
.robotrack .done{position:absolute;left:12px;bottom:6px;height:4px;border-radius:2px;background:var(--accent);width:calc((100% - 24px) * var(--sp))}
.robotrack .flag{position:absolute;right:10px;bottom:8px;width:22px;height:30px}
.robotrack .rb{position:absolute;bottom:8px;left:calc(12px + (100% - 90px) * var(--sp));width:60px;height:38px}
.rb .wheel{transform-box:fill-box;transform-origin:center;transform:rotate(calc(var(--sy) * 1.2deg))}
footer{padding-bottom:64px}

  clearTimeout(pet.timer); pet.timer=setTimeout(petStop,700);
  if(!pet.on && pet.dist>80){ pet.on=true; const q=btn.closest(".qbot"); if(q) q.classList.add("petting"); const b=document.querySelector(".qbubble"); if(b) b.textContent=PURRS[Math.floor(Math.random()*PURRS.length)]; }
  if(pet.on){
    const br=btn.getBoundingClientRect();
    if(now-pet.heartT>240){ pet.heartT=now; petHeart(btn,e.clientX-br.left,e.clientY-br.top); }
    if(pet.total>1800){ pet.total=0; for(let i=0;i<12;i++) setTimeout(()=>petHeart(btn,br.width*(.2+Math.random()*.6),br.height*(.15+Math.random()*.3),true),i*40); const b=document.querySelector(".qbubble"); if(b) b.textContent="I love FLL teams! Good luck at judging!"; }
  }
}

let fxBound=false;
function bindFx(){
  if(fxBound) return; fxBound=true;
  const root=document.documentElement.style;
  const fine=matchMedia("(hover:hover) and (pointer:fine)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!fine) return;
  let raf=0, last=null;
  document.addEventListener("pointermove",ev=>{
    last=ev; if(raf) return;
    raf=requestAnimationFrame(()=>{ raf=0; const e=last;
      const hero=document.querySelector(".hero");
      if(hero){ const r=hero.getBoundingClientRect(); if(e.clientY<r.bottom){ root.setProperty("--mx",((e.clientX/innerWidth)*2-1).toFixed(3)); root.setProperty("--my",(((e.clientY-r.top)/r.height)*2-1).toFixed(3)); root.setProperty("--px",(e.clientX-r.left)+"px"); root.setProperty("--py",(e.clientY-r.top)+"px"); } }
      const bb=document.querySelector(".bars-btn"); if(bb){ const r=bb.getBoundingClientRect(); if(r.bottom>0&&r.top<innerHeight){ const dx=(e.clientX-(r.left+r.width/2))/innerWidth, dy=(e.clientY-(r.top+r.height/2))/innerHeight; bb.style.setProperty("--lean",(Math.max(-1,Math.min(1,dx*2.2))*7).toFixed(2)+"deg"); bb.style.setProperty("--lx",(Math.max(-1,Math.min(1,dx*2.2))*8).toFixed(1)+"px"); bb.style.setProperty("--ly",(Math.max(-1,Math.min(1,dy*2))*-6).toFixed(1)+"px"); } }
      const card=e.target.closest && e.target.closest("#mentors .card, .why-grid > *, .steps > li");
      document.querySelectorAll(".tilt-on").forEach(c=>{ if(c!==card){ c.classList.remove("tilt-on"); c.style.removeProperty("--rx"); c.style.removeProperty("--ry"); } });
      if(card){ const r=card.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height; card.classList.add("tilt-on"); card.style.setProperty("--rx",((.5-y)*7).toFixed(2)+"deg"); card.style.setProperty("--ry",((x-.5)*9).toFixed(2)+"deg"); card.style.setProperty("--gx",(x*100).toFixed(1)+"%"); card.style.setProperty("--gy",(y*100).toFixed(1)+"%"); }
    });
  },{passive:true});
}

function findMeet(x){ const m=JSON.stringify(x||"").match(/https:\/\/meet\.google\.com\/[a-z0-9-]+/i); return m?m[0]:""; }

async function sendInvite(id){
  const b=S.bookings.find(x=>x._id===id); if(!b) return;
  const e=expertById(b.expert); const exEmail=S.emails[b.expert];
  if(!S.mcp){ S.inviteMsg={ok:false,text:"Нет доступа к Google Календарю. Подключите Google Calendar в настройках claude.ai и разрешите доступ, когда страница спросит."}; renderEditor(); return; }
  S.inviting=id; S.inviteMsg=null; renderEditor();
  const attendees=[];
  if(exEmail && /@/.test(exEmail)) attendees.push({email:exEmail,displayName:e?e.name:b.expertName});
  if(b.email && /@/.test(b.email)) attendees.push({email:b.email,displayName:b.team});
  if(!attendees.length && !orgList().length){ S.inviting=null; S.inviteMsg={ok:false,text:"Нет ни одного email для приглашения."}; renderEditor(); return; }
  orgList().forEach(m=>{ if(!attendees.some(a=>a.email.toLowerCase()===m.toLowerCase())) attendees.push({email:m,displayName:"FIZTEX team"}); });
  const desc=`FLL consultation via FIZTEX Expert Hub (25 min)\n\nTeam: ${b.team}\nContact: ${b.contact}\nProject: ${b.projectTitle||"-"}\n\nQuestions:\n${b.questions||"-"}`;
  try{
    const r=await S.mcp.callTool("Google Calendar","create_event",{
      summary:`FLL consultation: ${b.teamNumber||""} ${b.teamName||b.team} × ${e?e.name:b.expertName}`.replace(/\s+/g," ").trim(),
      startTime:b.slot.length===16?b.slot+":00":b.slot, endTime:addMinutes(b.slot,25), timeZone:"Asia/Almaty",
      description:desc+`\n\nJoin the call with the Google Meet link in this invitation (the same link for the team, the expert and the organizers).`, attendees, notificationLevel:"ALL",
      addGoogleMeetUrl:true,
      overrideReminders:[{method:"email",minutes:1440},{method:"email",minutes:5},{method:"popup",minutes:5}],
      guestPermissions:{guestsCanSeeGuests:false,guestsCanInviteOthers:false}
    });
    const pl=r?.payload??r; const meetUrl=(typeof pl?.conferenceUrl==="string"&&pl.conferenceUrl)||findMeet(pl); const eventId=findEventId(pl);
    if(meetUrl){ try{ await S.db.doc("rooms/m_"+id).set({url:meetUrl,at:new Date().toISOString()}); }catch{} }
    await S.db.doc("confirmed/"+id).set({meetUrl,eventId,sentTo:attendees.map(a=>a.email).join(", "),at:new Date().toISOString()});
    S.inviteMsg={ok:true,text:`Приглашение отправлено: ${attendees.map(a=>a.email).join(", ")}. Напоминания: за день и за 5 минут.${exEmail?"":" Email эксперта не указан — ему приглашение не ушло."}`};
  }catch(err){
    const c=err?.code;
    S.inviteMsg={ok:false,text: c==="server_not_connected"||c==="needs_reauth"?"Google Календарь не подключён или требует повторного входа. Подключите его в настройках claude.ai.":
      c==="not_granted"||c==="consent_required"?"Странице не разрешён доступ к Google Календарю. Разрешите его в меню Permissions этой страницы.":
      `Не удалось создать встречу${err?.message?": "+err.message:""}.`};
  }
  S.inviting=null; renderEditor();
}

let autoBusy=false;
async function autoInvite(){
  if(autoBusy||!S.mcp||!S.db||S.org.auto===false) return;
  const todo=S.bookings.filter(b=>!b.zoom&&S.taken.has(b._id)&&!S.confirmed[b._id]&&!S.tried.has(b._id)&&isFuture(b.slot));
  if(!todo.length) return;
  autoBusy=true;
  for(const b of todo){
    S.tried.add(b._id);
    try{ const lk=await S.db.doc("locks/"+b._id).get(); if(lk.exists && Date.now()-Date.parse(lk.data().at||0)<10*60000) continue;
      await S.db.doc("locks/"+b._id).set({at:new Date().toISOString()}); }catch{ continue; }
    await sendInvite(b._id);
  }
  autoBusy=false;
}

function getPath(o,p){ return p.split(".").reduce((a,k)=>a==null?a:a[k],o); }
function setPath(o,p,v){ const ks=p.split("."); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }
const inp=(label,path,opts={})=>{ const v=getPath(D,path)??""; const id="ed-"+path.replace(/\./g,"-");
  return `<label class="f" for="${id}">${esc(label)}${opts.area?`<textarea id="${id}" data-path="${esc(path)}" rows="${opts.rows||3}">${esc(v)}</textarea>`:`<input id="${id}" type="${opts.type||"text"}" data-path="${esc(path)}" value="${esc(v)}">`}</label>`; };

function markDirty(){ S.dirty=true; S.saveMsg=""; }
let typingTimer=null;
function onEdit(ev){
  const el=ev.target; const p=el.dataset?.path; if(!p) return;
  setPath(D,p,el.value); markDirty();
  // re-render page preview without rebuilding the editor (keeps focus)
  clearTimeout(typingTimer); typingTimer=setTimeout(()=>{ const open=S.editorOpen; S.editorOpen=false; render(); S.editorOpen=open; const f=$("#drawer .dfoot .small"); if(f) f.textContent="Есть неопубликованные изменения — сайт слева показывает предпросмотр."; $("#drawer [data-act=publish]")?.removeAttribute("disabled"); $("#drawer [data-act=revert]")?.removeAttribute("disabled"); }, 250);
}
function buildDocument(){
  const reset=document.head.querySelector("style")?.textContent||"";
  const kept=[...document.querySelectorAll("[data-keep]")];
  const before=kept.filter(el=>el.tagName!=="SCRIPT").map(el=>el.outerHTML).join("\n");
  const script=kept.find(el=>el.tagName==="SCRIPT").outerHTML;
  const json=JSON.stringify(D).replace(/</g,"\\u003c");
  return `<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>${reset}</style></head><body>`+
    before+`\n<div id="app"></div>\n<script type="application/json" id="site-data">${json}<\/script>\n`+script+`</body></html>`;
}
async function publish(){
  if(S.admin){ S.saving=true; renderEditor();
    try{ const j=await api("saveContent",{password:S.admin.pw,content:D}); if(!j.ok) throw new Error(j.error); SAVED=structuredClone(D); S.dirty=false; S.saveMsg="Опубликовано. Все посетители уже видят изменения."; }
    catch(err){ S.saveMsg="Не удалось опубликовать. Попробуйте ещё раз."; }
    S.saving=false; renderEditor(); return; }
  if(!S.artifact){ S.saveMsg="Публикация доступна только в claude.ai."; renderEditor(); return; }
  S.saving=true; renderEditor();
  try{ await S.artifact.publish(buildDocument()); S.dirty=false; S.saveMsg="Опубликовано. Страница сейчас обновится."; }
  catch(err){ S.saveMsg = err?.code==="conflict" ? "Страницу только что изменили в другом окне — она перезагрузится, повторите правку." : err?.code==="not_writer"||err?.code==="not_granted" ? "У этой учётной записи нет прав на редактирование." : "Не удалось опубликовать. Попробуйте ещё раз."; }
  S.saving=false; renderEditor();
}

async function resizeImage(file){
  try{ const bmp=await createImageBitmap(file); const k=Math.min(1,1800/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*k); c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",0.82)); }
  catch{ return file; }
}

  const u=ev.target.dataset?.upload; if(u && S.assets){
    const files=[...ev.target.files]; if(!files.length) return;
    const msg=$("#up-msg"); const set=t=>{ const m=$("#up-msg"); if(m) m.textContent=t; else { S.saveMsg=t; } };
    set("Загружаю…");
    try{
      for(const f of files){
        const r=await S.assets.upload(await resizeImage(f));
        if(u==="hero") D.hero.bg=r.url; else if(u[0]==="x") D.experts[+u.slice(1)].photo=r.url; else if(u==="new") (D.gallery=D.gallery||[]).push({src:r.url,caption:""}); else D.gallery[+u.slice(1)].src=r.url;
      }
      markDirty(); render();
    }catch(err){ S.saveMsg="Не удалось загрузить фото. Проверьте размер (до 20 МБ) и формат."; renderEditor(); }
    return;
  } if(ev.target.closest("#drawer") && ev.target.tagName==="SELECT"){ onEdit(ev); } if(ev.target.closest("#drawer") && ev.target.type==="datetime-local"){ renderEditor(); } });
document.addEventListener("submit",async ev=>{
  if(ev.target.id!=="review-form") return; ev.preventDefault();
  const team=$("#rv-team").value.trim(), text=$("#rv-text").value.trim(), mentor=$("#rv-mentor").value;
  if(!team||!text) return;
  if(!S.db && SCRIPT_URL){
    try{ const j=await api("review",{team,text,mentor,mentorName:expertById(mentor)?.name||"",rating:S.rating}); if(!j.ok) throw 0; S.reviews.unshift(j.review); S.reviewMsg={ok:true,text:"Thank you! Your review is published."}; S.rating=5; }
    catch{ S.reviewMsg={ok:false,text:"Couldn't publish the review. Please try again."}; }
    render(); return;
  }
  if(!S.db) return;
  try{ await S.db.collection("reviews").add({team,text,mentor,mentorName:expertById(mentor)?.name||"",rating:S.rating,at:new Date().toISOString()});
       S.reviewMsg={ok:true,text:"Thank you! Your review is published."}; S.rating=5; }
  catch(err){ S.reviewMsg={ok:false,text:"Couldn't publish the review. Please try again."}; }
  render();
});
document.addEventListener("click",async ev=>{
  const t=ev.target.closest("button,a"); if(!t) return;
  const ds=t.dataset;
  if(ds.acancel){ if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Точно отменить? Команда и эксперт получат письмо"; return; } t.disabled=true;
    try{ const j=await api("cancel",{password:S.admin.pw,key:ds.acancel}); if(j.ok){ S.adminBookings=j.bookings||[]; S.taken.delete(ds.acancel); render(); } }catch{} return; }
  if(ds.adelrev){ if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Точно удалить?"; return; } t.disabled=true;
    try{ const j=await api("deleteReview",{password:S.admin.pw,id:ds.adelrev}); if(j.ok){ S.reviews=j.reviews||[]; render(); } }catch{} return; }
  if(ds.copymail){ const tip=t.querySelector(".tip"); try{ await navigator.clipboard.writeText(ds.copymail); if(tip) tip.textContent="Copied"; }catch{ const a=t.querySelector(".addr"); if(a){ const r=document.createRange(); r.selectNodeContents(a); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r);} if(tip) tip.textContent="Press Ctrl+C"; } setTimeout(()=>{ if(tip) tip.textContent="Copy"; },2000); return; }
  if(ds.faq!==undefined){ const i=+ds.faq; S.faqOpen=S.faqOpen===i?-1:i; render(); return; }
  if(ds.pickq!==undefined){ S.tipAt=0; const q=ds.pickq; const add=!S.picked.includes(q); S.picked=add?[...S.picked,q]:S.picked.filter(x=>x!==q); if(add) S.cheer=Date.now(); const rr=t.getBoundingClientRect(); render(); if(add&&S.picked.length===3) brickConfetti(rr.left+rr.width/2,rr.top,40); return; }
  if(ds.filter){ S.filter=ds.filter; render(); return; }
  if(ds.call){ closeModal(); openCall(ds.call); return; }
  if(ds.zbook!==undefined){ openZoomBooking(ds.zbook); return; }
  if(ds.book){ const [e,s]=ds.book.split("|"); openBooking(e,s); return; }
  if(ds.star){ S.rating=+ds.star; document.querySelectorAll(".stars button").forEach(b=>{ const n=+b.dataset.star; b.classList.toggle("on",n<=S.rating); b.setAttribute("aria-checked",String(n===S.rating)); }); return; }
  if(ds.copy!==undefined){ try{ await navigator.clipboard.writeText(ds.copy); t.textContent="Copied"; }catch{ const n=$("#fb-text"); if(n){ const r=document.createRange(); r.selectNodeContents(n); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} } return; }
  if(ds.ics){ const [e,s]=ds.ics.split("|"); try{ await S.downloads.save({filename:"fiztex-consultation.ics",data:new Blob([icsFor(e,s)],{type:"text/calendar"})}); }catch{} return; }
  if(ds.delPhoto!==undefined){ D.experts[+ds.delPhoto].photo=""; markDirty(); render(); return; }
  if(ds.gmove){ const [i,dir]=ds.gmove.split("|").map(Number); const a=D.gallery; const j=i+dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; markDirty(); render(); return; }
  if(ds.gdel!==undefined){ if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Точно убрать?"; return; } D.gallery.splice(+ds.gdel,1); markDirty(); render(); return; }
  if(ds.tab){ S.tab=ds.tab; renderEditor(); return; }
  if(ds.addSlot!==undefined){ const e=D.experts[+ds.addSlot]; const last=e.slots[e.slots.length-1]; let base=new Date(Date.now()+86400000); if(last&&!isNaN(slotTime(last))) base=new Date(slotTime(last)+86400000);
      const local=new Date(base.getTime()+5*3600000).toISOString().slice(0,11)+"16:00"; e.slots.push(local); markDirty(); render(); return; }
  if(ds.delSlot){ const [i,j]=ds.delSlot.split("|").map(Number); D.experts[i].slots.splice(j,1); markDirty(); render(); return; }
  if(ds.delExpert!==undefined){ const i=+ds.delExpert; if(t.dataset.armed){ D.experts.splice(i,1); markDirty(); render(); } else { t.dataset.armed="1"; t.textContent="Точно удалить?"; } return; }
  if(ds.move){ const [i,dir]=ds.move.split("|").map(Number); const a=D.experts; const j=i+dir; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; markDirty(); render(); return; }
  if(ds.fwd){ S.db?.doc("confirmed/"+ds.fwd).set({forwarded:true,at:new Date().toISOString()}).catch(()=>{}); return; }
  if(ds.invite){ sendInvite(ds.invite); return; }
  if(ds.cancel){ if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Подтвердить отмену"; return; } try{ const c=S.confirmed[ds.cancel];
      if(c&&c.eventId&&S.mcp){ try{ await S.mcp.callTool("Google Calendar","delete_event",{eventId:c.eventId,notificationLevel:"ALL"}); }catch{ S.inviteMsg={ok:false,text:"Бронь отменена, но встречу в календаре удалите вручную."}; } }
      if(c) await S.db.doc("confirmed/"+ds.cancel).delete();
      try{ await S.db.doc("rooms/m_"+ds.cancel).delete(); }catch{}
      await S.db.doc("taken/"+ds.cancel).delete(); }catch{ S.saveMsg="Не удалось отменить бронь."; renderEditor(); } return; }
  if(ds.delReview){ if(!t.dataset.armed){ t.dataset.armed="1"; t.textContent="Точно удалить?"; return; } try{ await S.db.doc("reviews/"+ds.delReview).delete(); }catch{ S.saveMsg="Не удалось удалить отзыв."; renderEditor(); } return; }
  switch(ds.act){
    case "close": closeModal(); break;
    case "clear-picks": S.picked=[]; render(); break;
    case "bars": { const r=t.getBoundingClientRect(); S.tipIdx=S.tipAt?(S.tipIdx||0)+1:(S.tipIdx||0); S.tipAt=Date.now(); S.cheer=Date.now(); S.barsTaps=(S.barsTaps||0)+1; render(); brickConfetti(r.left+r.width/2,r.top+r.height*.35,S.barsTaps%5===0?70:18); const nb=document.querySelector(".bars-btn"); if(nb) nb.focus({preventScroll:true}); break; }
    case "stay": clearTimeout(meetTimer); t.remove(); break;
    case "org-login": openLogin(); break;
    case "org-logout": try{ sessionStorage.removeItem("fz_pw"); }catch{} location.reload(); break;
    case "leave-call": callEl?.remove(); callEl=null; break;
    case "open-editor": S.editorOpen=true; renderEditor(); break;
    case "close-editor": S.editorOpen=false; $("#drawer")?.remove(); break;
    case "add-item": D.team.items.push(""); markDirty(); render(); break;
    case "add-expert": D.experts.push({id:"e"+Date.now().toString(36),name:"",title:"",category:D.categories[0].id,bio:"",slots:[]}); markDirty(); render(); setTimeout(()=>{ const b=$("#drawer .dbody"); if(b) b.scrollTop=b.scrollHeight; },0); break;
    case "revert": D=structuredClone(SAVED); S.dirty=false; S.saveMsg=""; render(); break;
    case "publish": publish(); break;
  }
});
function zoom(i){ const g=(D.gallery||[]).filter(x=>x.src)[i]; if(!g) return; const lb=document.createElement("div"); lb.className="lightbox"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true");
  lb.innerHTML=`<img src="${esc(g.src)}" alt="${esc(g.caption)}">${g.caption?`<p>${esc(g.caption)}</p>`:""}`; lb.addEventListener("click",()=>lb.remove()); document.body.appendChild(lb); }
document.addEventListener("click",ev=>{ const f=ev.target.closest("figure[data-zoom]"); if(f) zoom(+f.dataset.zoom); });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"){ if(modalEl) closeModal(); document.querySelector(".lightbox")?.remove(); } if(ev.key==="Enter"){ const f=ev.target.closest?.("figure[data-zoom]"); if(f) zoom(+f.dataset.zoom); } });

render();
onScrollFx();
if(OFFSITE && SCRIPT_URL){
  fetch(SCRIPT_URL+"?action=all").then(r=>r.json()).then(j=>{ if(!j||!j.ok) return;
    if(j.content&&Array.isArray(j.content.experts)&&!S.dirty){ SAVED=j.content; D=structuredClone(SAVED); }
    if(Array.isArray(j.taken)) S.taken=new Set(j.taken);
    if(Array.isArray(j.reviews)) S.reviews=j.reviews;
    render();
  }).catch(()=>{});
  let pw=null; try{ pw=sessionStorage.getItem("fz_pw"); }catch{}
  if(pw) adminLogin(pw);
}

/* ---------- live capabilities ---------- */
(async()=>{
  if(!window.claude?.use) return;
  const [db,user,artifact,downloads,assets,mcp]=await Promise.all(["db","user","artifact","downloads","assets","mcp"].map(n=>window.claude.use(n).catch(()=>null)));
  S.downloads=downloads;
  S.user=user;
  if(user){ try{ S.canEdit=await user.canEdit(); }catch{} try{ S.uid=await user.id(); }catch{} }
  if(artifact && S.canEdit) S.artifact=artifact;
  if(assets && S.canEdit) S.assets=assets;
  if(mcp && S.canEdit) S.mcp=mcp;
  if(db && user){
    S.db=db;
    db.collection("rooms").onSnapshot(snap=>{ const mm={}; snap.docs.forEach(d=>{ if(d.id.startsWith("m_")&&d.data()?.url) mm[d.id.slice(2)]=d.data().url; }); S.meet=mm; render(); },()=>{});
    if(S.uid) db.doc("bookings/"+S.uid).onSnapshot(d=>{ S.mine=Object.entries((d.exists&&d.data().items)||{}).map(([k,v])=>({_id:k,...v})); render(); },()=>{});
    setInterval(()=>{ if(S.mine.length && !modalEl && !S.editorOpen) render(); },60000);
    db.collection("taken").onSnapshot(snap=>{ S.taken=new Set(snap.docs.map(d=>d.id)); render(); },()=>{});
    db.collection("reviews").onSnapshot(snap=>{ S.reviews=snap.docs.map(d=>({_id:d.id,...d.data()})).sort((a,b)=>String(b.at).localeCompare(String(a.at))); render(); },()=>{});
    if(S.canEdit){
      db.doc("private/experts").onSnapshot(d=>{ S.emails=Object.assign({},(d.exists&&d.data().emails)||{}); if(S.editorOpen&&S.tab!=="experts") renderEditor(); },()=>{});
      db.collection("confirmed").onSnapshot(snap=>{ S.confirmed=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()])); if(S.editorOpen) renderEditor(); setTimeout(autoInvite,1500); },()=>{});
      db.doc("private/settings").onSnapshot(d=>{ S.org=Object.assign({emails:"",auto:true},(d.exists&&d.data())||{}); setTimeout(autoInvite,1500); },()=>{});
    }
    if(S.canEdit) db.collection("bookings").onSnapshot(snap=>{ S.bookings=snap.docs.flatMap(d=>Object.entries((d.data()||{}).items||{}).map(([k,v])=>({_id:k,...v}))); if(S.editorOpen) renderEditor(); else render(); setTimeout(autoInvite,1500); },()=>{});
  }
  render();
})();
})();
